<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500..700&display=swap"
    />
    <style>
      body {
        margin: 0;
      }
      #s {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: radial-gradient(90% 120% at 80% 30%, #1d1e22, #0b0b0d 70%);
        font-family: 'Instrument Sans', sans-serif;
        color: #f5f5f7;
      }
      #t {
        position: absolute;
        left: 64px;
        top: 150px;
        width: 460px;
      }
      #t img {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow:
          0 12px 36px rgba(255, 131, 0, 0.25),
          0 6px 24px rgba(11, 147, 241, 0.25);
      }
      h1 {
        font-size: 62px;
        line-height: 1;
        letter-spacing: -0.035em;
        font-weight: 600;
        margin: 30px 0 18px;
      }
      p {
        margin: 0;
        font-size: 22px;
        line-height: 1.35;
        color: #a1a1a6;
        font-family: -apple-system, sans-serif;
      }
      #f {
        position: absolute;
        left: 470px;
        top: 20px;
        width: 900px;
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <div id="s">
      <img id="f" src="../../assets/video/aircursor-demo.jpg" />
      <div id="t">
        <img src="../../assets/img/aircursor-icon-ipad.png" />
        <h1>Your Mac, at the tip of your Pencil.</h1>
        <p>iPad and Apple Pencil as a drawing tablet and trackpad for your Mac.</p>
      </div>
    </div>
    <script>
      window.render = () => {};
    </script>
  </body>
</html>
